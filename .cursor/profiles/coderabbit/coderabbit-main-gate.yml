name: CodeRabbit latest-head gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: ["{{DEFAULT_BRANCH}}"]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read

jobs:
  latest-head:
    if: github.event.pull_request.head.ref == '{{ACCUMULATOR_BRANCH}}'
    runs-on: ubuntu-latest
    steps:
      - name: Require a CodeRabbit review on the latest head
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo
            const pull_number = context.payload.pull_request.number
            const head = context.payload.pull_request.head.sha
            const reviews = await github.paginate(
              github.rest.pulls.listReviews,
              { owner, repo, pull_number, per_page: 100 },
            )
            const latest = reviews
              .filter((review) =>
                review.user?.login === "coderabbitai[bot]" &&
                review.commit_id === head
              )
              .sort((a, b) => new Date(b.submitted_at) - new Date(a.submitted_at))[0]
            if (!latest) core.setFailed("No CodeRabbit review exists for the latest head.")
            if (latest && ["CHANGES_REQUESTED", "DISMISSED"].includes(latest.state)) {
              core.setFailed(`CodeRabbit latest-head review is ${latest.state}.`)
            }
